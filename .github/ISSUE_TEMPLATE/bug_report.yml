name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much relevant information as possible so we can reproduce and fix the bug quickly.
  - type: input
    id: version
    attributes:
      label: FileEx Version
      description: What version of FileEx are you running? (Check TitleBar or Settings -> About)
      placeholder: "e.g. 0.6.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - "Linux (Ubuntu/Debian .deb)"
        - "Linux (.AppImage)"
        - "Linux (Other distro/tarball)"
        - "Windows 11"
        - "Windows 10"
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open FileEx
        2. Navigate to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Drag and drop screenshots or paste console / terminal output if applicable.
    validations:
      required: false
