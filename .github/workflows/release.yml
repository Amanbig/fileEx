name: 'publish'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'app-v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - name: Prepare release notes
        id: release_notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_TAG="${TAG#v}"
          NOTES_FILE=""
          if [ -f "releases/${TAG}.md" ]; then
            NOTES_FILE="releases/${TAG}.md"
          elif [ -f "releases/v${CLEAN_TAG}.md" ]; then
            NOTES_FILE="releases/v${CLEAN_TAG}.md"
          elif [ -f "RELEASE_NOTES.md" ]; then
            NOTES_FILE="RELEASE_NOTES.md"
          fi

          if [ -n "$NOTES_FILE" ]; then
            echo "Found release notes in $NOTES_FILE"
            {
              echo "body<<EOF_RELEASE_NOTES"
              cat "$NOTES_FILE"
              echo ""
              echo "EOF_RELEASE_NOTES"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=See the assets to download this version and install." >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FileEx ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
